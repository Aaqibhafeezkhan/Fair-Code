name: Traction vs GitHub

# Weekly check that the traction figures in README.md, ROADMAP.md and METRICS.md still match GitHub (#1148).
# scripts/check_traction.py (run by `make lint`) only compares the three files with each other, so all three can
# agree and be stale. `--live` also reads stars, forks, watchers and contributors from the API. This is a report,
# never a gate: nothing here is a required check. When a figure differs it opens (or edits) ONE issue, "Traction
# figures out of date (weekly check)"; when they all match it closes that issue.

on:
  schedule:
    - cron: "43 5 * * 1"      # Mondays, 05:43 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compare the figures with GitHub
        run: |
          set +e
          python3 scripts/check_traction.py --live > "$RUNNER_TEMP/out.txt" 2> "$RUNNER_TEMP/err.txt"
          echo "$?" > "$RUNNER_TEMP/status"
          cat "$RUNNER_TEMP/out.txt" "$RUNNER_TEMP/err.txt"
          exit 0

      - name: Open, update or close the tracking issue
        run: python3 scripts/update_weekly_issue.py traction "$RUNNER_TEMP/status" "$RUNNER_TEMP/err.txt"
