name: browser smoke

# Opens profiler.html?demo, profiler.html?demo=compare, benchmark.html and index.html in real
# Chromium and fails on any console or page error (#988). Not a required check: it downloads a
# browser, so it stays separate from the fast test job until it has proven stable.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest and Playwright
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run the browser smoke tests
        run: python -m pytest tests/browser -q
